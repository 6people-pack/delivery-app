<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 페이지</title>
    <style>
        body { font-family: system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",Arial; background:#f8fafc; margin:0; }
        .wrap { max-width:400px; margin:15vh auto; background:#fff; padding:24px; border-radius:14px; box-shadow:0 8px 30px rgba(2,8,23,.08); }
        h1 { text-align:center; margin-bottom:20px; }
        input { width:100%; padding:12px; margin-bottom:10px; border:1px solid #e2e8f0; border-radius:10px; font-size:16px; }
        button { width:100%; padding:12px; background:#0ea5e9; color:#fff; border:none; border-radius:10px; font-weight:700; cursor:pointer; }
        .msg { text-align:center; color:#475569; margin-top:10px; font-size:14px; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>로그인</h1>
    <input type="text" id="email" placeholder="이메일" />
    <input type="password" id="password" placeholder="비밀번호" />
    <button id="loginBtn">로그인</button>
    <div class="msg" id="msg"></div>
</div>

<script>
    const API_URL = '/api/user/login';
    const loginBtn = document.getElementById('loginBtn');
    const msg = document.getElementById('msg');

    loginBtn.addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) {
            msg.textContent = '이메일과 비밀번호를 입력하세요.';
            return;
        }

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });

            if (!res.ok) {
                msg.textContent = '로그인 실패 (이메일 또는 비밀번호를 확인하세요)';
                return;
            }

            // Access Token을 헤더에서 추출
            const accessToken = res.headers.get('Authorization');
            if (!accessToken) {
                msg.textContent = 'Access Token을 받을 수 없습니다.';
                return;
            }

            // localStorage에 저장
            localStorage.setItem('accessToken', accessToken);

            msg.textContent = '로그인 성공! 결제 페이지로 이동합니다...';
            setTimeout(() => {
                window.location.href = '/toss.html';
            }, 1000);

        } catch (e) {
            console.error(e);
            msg.textContent = '로그인 요청 중 오류가 발생했습니다.';
        }
    });
</script>
</body>
</html>
